# THE JOB CATALOGUE — every `qv4-` job type the scheduler may run, and the
# rules for sharing the graphics cards (plan step 2.4, "The nine rules").
#
# A job declares what it needs (docs/contracts/job.md): `needs` is
# "model-profile" with a `profile` from profiles.toml, or "processor";
# `memory_gb` is per parallel worker, MEASURED from run records, never
# computed; `deadline_s` is longer than its work and shorter than its
# interval; `query_timeout_s` sits under the deadline so a job killed at its
# deadline does not leave its query running. `class` is rule 8: "waiting"
# (someone is waiting), "due" (by a time), "whenever" (bulk).
# `requires` names the programs the box must have: node1 once lacked the page
# reader and blanked the totals for 17 days with the board green.
# A timetable is `every_s` or `at_utc` (HH:MM UTC, one or a list; both
# clocks hold local time): it lives here, in the queue, not in a timer on
# one box (step 2.12). `nice` is the child's niceness.
# `wanted` makes a standing service (step 2.13). `pieces` cuts a job into
# pieces that each record progress (rule 7); the command then takes the
# piece key as its last argument.
#
# Hard limit 23: every name carries qv4-. `python -m support.scheduler check`
# refuses a catalogue that breaks a rule.

version = 1

[queueing]
slice_seconds = 3600          # rule 2: a job keeps its card for up to an hour while it has work
drain_not_kill = true         # rule 3
min_queue_to_evict = 8        # rule 5's floor until the profile's load time is measured
max_wait_seconds = 1800       # rule 6: a small job gets its card after 30 minutes regardless
piece_seconds = 300           # rule 7: a piece is a few minutes
due_horizon_seconds = 7200    # rule 8: a due job goes ahead of bulk work this close to its time
memory_reserve_gb = 24        # step 2.5: kept for the database and the standing services
lease_seconds = 90            # step 2.8: a running job renews its lease well inside this
policy = "priority-ordered-round-robin"

# Step 2.9: the cards the carve-out holds. The planner never evicts these.
# The baseline (docs/baseline.md): node2 card 0 holds querynz-agent-llm
# (:8020, 2x50k) and querynz-vision-ocr (:8032). Card 1 is free since
# querynz-llm@1 was stopped in 1.4 batch 2. node1 is out (ruling 55).
[[reservations]]
box = "node2"
card = 0
holder = "querynz-agent-llm, querynz-vision-ocr"
why = "the carve-out's chat model and page reader (step 2.9); a fixed reservation, never touched"

# ── the founding jobs, on the queue's clock (step 2.12) ─────────────────────
# Installed by the founding session as systemd timers on node2 (local time,
# NZDT = UTC+13 until 5 April 2027); here in UTC, with the deadlines the
# units carried and a query limit under each. The installer supersedes the
# timers: a `.timer` whose job is timetabled here is disabled, and the clock
# is handed over so nothing runs twice. When the clocks change, these times
# move with them or they drift an hour against the old estate's jobs.

[jobs.qv4-checks-board]
description = "The checks board (plan 1.6): every registered check, the board written, alarms on red. Daily at 07:30 NZDT, after the old release (06:15) and the old board (06:40)."
needs = "processor"
memory_gb = 1.0
deadline_s = 3600
query_timeout_s = 600
class = "due"
priority = 11
command = ["python", "-m", "checks.board"]
at_utc = "18:30"
nice = 10

[jobs.qv4-checks-heartbeat]
description = "The checks board heartbeat: alarms if the board has not run in 26 hours. Twice daily, 09:00 and 21:00 NZDT."
needs = "processor"
memory_gb = 0.3
deadline_s = 300
query_timeout_s = 60
class = "due"
priority = 12
command = ["python", "-m", "checks.board", "--heartbeat"]
at_utc = ["20:00", "08:00"]

[jobs.qv4-full-tier]
description = "The full tier (plan 1b.7): every test, the slow ones included, against the real environment. Nightly at 04:30 NZDT, before the board."
needs = "processor"
memory_gb = 6.0
deadline_s = 7200
query_timeout_s = 1800
class = "due"
priority = 13
command = ["python", "bin/full-tier"]
at_utc = "15:30"
nice = 10

# Track B (offsite-2a, offsite-2b): the copy replaced the step 1.8 dump of
# querynz_v4 once a copy restored from the bucket to equality (19 October).

[jobs.qv4-offsite-copy]
description = "The off-site copy (track B, ruling 21): every table and file tree the delete rule keeps, changes nightly and a full checkpoint on Sunday; the press graph frozen (sent when it moves, or every 28 days). Replaces the step 1.8 dump of querynz_v4 once its restore from the bucket is proven. 21:00 NZDT, finished before the old estate's push (01:38) takes the link; a run cut off at its deadline resumes the next night."
needs = "processor"
memory_gb = 1.5
deadline_s = 16200
query_timeout_s = 7200
class = "due"
priority = 14
command = ["python", "-m", "support.offsite", "copy"]
requires = ["pg_dump", "gpg", "zstd"]
at_utc = "08:00"
nice = 10

[jobs.qv4-offsite-rehearsal]
description = "The off-site restore rehearsal (track B): the newest copy fetched from the bucket through the read-only key, restored into a scratch server on /mnt/hdd2, every table and file checked equal to the manifest, the time recorded. Every 28 days; the restored copy is removed after."
needs = "processor"
memory_gb = 3.0
deadline_s = 43200
query_timeout_s = 7200
class = "whenever"
priority = 15
command = ["python", "-m", "support.offsite", "restore"]
requires = ["pg_restore", "initdb", "gpg", "zstd"]
every_s = 2419200
nice = 10

