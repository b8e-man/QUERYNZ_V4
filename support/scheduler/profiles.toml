# THE MODEL PROFILES (plan step 2.15): a model plus its settings on a card. Two kinds beside the
# llama-server ones the worker loads: a STANDING server its own unit runs (`unit`, `port`, `cards`), and a
# VIEW on one (`on`, `request`), ruling 121.
#
# A card holds one profile at a time (hard limit 25); jobs naming the loaded
# profile run together up to its `slots`. `context` is PER REQUEST; the
# server's `-c` is derived (context x slots). `memory_gb` is measured with
# rocm-smi against the running server and `measured_geometry` says at which
# geometry; `load_seconds` is the measured load time (rule 9) and is written
# back by the first swap that measures it. Weights are relative to the models
# folder (/home/user/models, or QV4_MODELS). The model name is what the
# server advertises (--alias) and what every call demands; an answer from
# another model is refused (the model-client contract).

# Which model server the cards run: "copy" is the old build's binary taken
# as it is (`<live>/llama/bin`); "built" is the estate's own build from
# source (`python -m support.installer build`, `<live>/llama/built/bin`).
# Either is the estate's own program; the frozen product's servers keep
# theirs (hard limit 23). One line to switch; a missing one falls back.
# A profile may name its own server instead (`binary = "<probe name>"`):
# then it loads only where the probe lists that program, and never falls
# back. TeleOCR's conversion needs the patched build beside the others,
# `qv4-llama-server-teleocr` at <live>/llama/built-teleocr/.
[server]
binary = "built"

# FLASH-NEXT ON RADIANCE (ruling 121, 29 October 2026; by night on node2 since 26 November 2026, jobs.toml [standing]:
# the lanes it reads better than the 27B, the spot check of that day): on node2 Qwen3.8-Flash-Next replaces Qwen3.6 as the text
# reader and the questions model. A STANDING server: its own unit `qv4-radiance-flash` (`qv4-radiance` until 26 November) (support/scheduler/units/) runs Radiance in
# a container across both cards as ONE profile; the card manager reads its model back and marks both cards, and
# never plans it. It stops and starts the unit in one case only: the night window of jobs.toml `[night_window]`
# (ruling 129), for the page reader. The unit holds the server's settings (slots, context bound, pool, headroom);
# `flags` is empty because no llama-server is started for it, and a test holds the unit and this block equal.
# Measured 29 October 20:18 with the unit started after the frozen OCR server: rocm-smi --showpids 56.06 GB for
# radiance over the two cards (26.1 GiB a card; 29.3 and 27.9 GiB used of 31.9 with the OCR server and driver), host
# RSS 28.4 GiB (11 GiB a rank of pinned experts); 21.6 s from `systemctl --user start` to qwen4exp read back on :8060.
[profiles.flash-next]
model = "qwen4exp"
binary = "radiance"
unit = "qv4-radiance-flash.service"
port = 8060
cards = 2
weights = ["radiance/qwen3.8-next-flash-fp8-iq4r-moe.rad"]
slots = 10   # 16 until 12 November 2026: the log held 8 in flight 90% of the busy time; the unit says why
context = 32768   # 31 October: the 32k bound and a 20 GiB pool a rank, so the KV cache is 524,396 tokens (5.8 GB a card) not 22,652 (the bulk ingest, ruling 130)
temperature = 0.0
max_tokens = 8192
memory_gb = 27.1   # re-read 13 November 2026 at 10 slots: the server claims what the card has free (node1 27.09 GiB, node2 25.30 beside 4.87 already held); the larger box's
host_memory_gb = 82.7   # re-read 13 November 2026 13:5x at 10 slots (podman stats): node1 82.7 GB, the n-gram table in RAM and 9.1 GiB of experts a rank in the host pool; node2 32.0 GB, its table on /mnt/ssd2 (ruling 171); the larger box's (87.9 at 16 slots, 1 November)
measured_geometry = "32768x10"   # 12 November 2026, the unit's new shape (was 32768x16); memory_gb and host_memory_gb re-read at it 13 November
load_seconds = 21.6
flags = []
used_for = "The standing server the text reader and review are views on (ruling 121)"

# The text reader and review are VIEWS on flash-next: the same model on the same cards, sharing its 10 slots; what
# differs is what each request says (`request`, handed to the job as QV4_MODEL_REQUEST). Radiance takes a request's
# own chat_template_kwargs over the server's default (thinking off) and closes the reasoning at thinking_token_budget.
[profiles.text-reader]
on = "flash-next"
model = "qwen4exp"
slots = 10
context = 32768
temperature = 0.0
max_tokens = 8192
streams = 8   # measured 31 October 13:44-15:50: 8 streams of beehive pieces 155 a minute (median call 2.6 s, p90 4.3); 16 streams 145 a minute (median 6.6 s): no gain past 8 to 10 for short documents. The cap on pieces in flight across every row on this server, each row's concurrency x threads within it
request = {chat_template_kwargs = {enable_thinking = false}}
used_for = "Turning text into rows; the old job type was document-read. No thinking for a reader (lessons/a-reader-profile-turns-thinking-off.md)"

[profiles.review]
on = "flash-next"
model = "qwen4exp"
slots = 10
context = 32768
temperature = 0.2
max_tokens = 6144
request = {chat_template_kwargs = {enable_thinking = true}, thinking_token_budget = 2048}
used_for = "Answering questions in products. Thinking on, closed at 2,048 tokens so the answer is never all reasoning"

# QWEN 3.8 27B, ONE SERVER A CARD (Arthur, 26 November 2026: one instance of the dense model on each card; "use
# 27b for reading the media", "a scheduled configuration change based on document profiles"). By day it stands on
# both boxes, every card on the media read; by night node2 stands Flash-Next instead (jobs.toml [standing]). A
# STANDING server: its unit `qv4-radiance` is the proxy on :8060
# (support/scheduler/fanout.py) over `qv4-radiance-card@0` and `@1` (support/scheduler/units/), each Radiance at
# tensor parallel 1 with 8 sequences at the 32k bound, so 16 a box. The card manager reads its model back through the
# proxy and marks both cards, and never plans it; it stops and starts the unit in the night window only (ruling 129).
# `flags` is empty because no llama-server is started for it; a test holds the units and this block equal. Measured 26
# November on node2 (the trial servers, the same image and model): rocm-smi 31.2 and 31.4 GiB used of 31.9 a card,
# 3.8 GiB of it held before the server (driver, the frozen OCR server on card 0); host RSS 20.0 GB a server; 17 s from
# the container's start to its listening line.
[profiles.qwen38-27b]
model = "qwen38-27b"
binary = "radiance"
unit = "qv4-radiance.service"
port = 8060
cards = 2
weights = ["radiance/qwen3.8-27b-mxfp4.rad"]
slots = 16   # 8 a card (Arthur, 26 November: "lets go with 8"); the trial's 16 a card was no faster an article
context = 32768
temperature = 0.0
max_tokens = 8192
memory_gb = 27.4
host_memory_gb = 40.0   # 20.0 GB a server, two a box
measured_geometry = "32768x16"
load_seconds = 17.3
flags = []
used_for = "The standing server the news reader is a view on (Arthur, 26 November 2026)"

# The news reader is a VIEW on qwen38-27b (Arthur, 26 November 2026: "use 27b for reading the media"): on his answers
# to tranches 2-7 the 27B's quotes were 90% right ungated (Flash-Next 52%), its roles 92% (85%), its tones with the
# tones pass 90% (84%). Thinking off, as for every reader.
[profiles.news-reader]
on = "qwen38-27b"
model = "qwen38-27b"
slots = 16
context = 32768
temperature = 0.0
max_tokens = 12000
streams = 16   # 8 a card, the trial's best (26 November 2026: 22.8 articles a minute on node2, two passes)
request = {chat_template_kwargs = {enable_thinking = false}}
used_for = "Reading news articles into rows (registers.news.read); the media's own document profile"

[profiles.embedding]
model = "bge-m3-q8"
weights = ["bge-m3-Q8_0.gguf"]
slots = 8
context = 8192
temperature = 0.0
max_tokens = 0
memory_gb = 0.7
measured_geometry = "16384x8"      # the old node1 burst servers; re-measure at 8192x8
flags = ["--embedding", "--pooling", "cls", "-ub", "8192", "--no-cache-prompt"]
embedding = true
used_for = "Search: prompt cache off, many copies per card"

[profiles.page-reader]
model = "glm-ocr"
weights = ["vision-glm-ocr/GLM-OCR-Q8_0.gguf", "vision-glm-ocr/mmproj-GLM-OCR-Q8_0.gguf"]
slots = 3   # 1 until 30 October; three documents at once on the one card the night window gives (Arthur, 16:00)
context = 32768
temperature = 0.0
max_tokens = 8000
memory_gb = 4.8
measured_geometry = "32768x1"      # node1 card 1, rocm-smi 2026-09-22
flags = ["--jinja"]
dpi = 300
used_for = "Image pages: GLM-OCR, then whatever step 3 chooses"

