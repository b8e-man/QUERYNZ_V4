# THE DECLARED GAPS (checks/source_lights.py): a register whose corpus is
# known not to be whole while its updates work, so its light on the board
# is orange. One [[gap]] each: the register (as the board's catalogue names
# it), the reason in plain words, the date it was declared, and its source.
# A gap closed is a line deleted, in the commit that closes it. A gap may
# name `hosts` the fetch gate holds (ruling 141): its reason then says that
# hold, and the gate's own line for it is not repeated on the light.

[[gap]]
register = "courts"
reason = "the ingest MCP lacks most of the High Court and Court of Appeal back catalogue (31,554 and 10,326 decisions by its own gaps tool) and holds no Tenancy Tribunal, Waitangi Tribunal or Māori Land Court decisions"
since = "2026-11-03"
source = "docs/research/mcp-gaps-for-provider-2026-11-03.md, section 1"

