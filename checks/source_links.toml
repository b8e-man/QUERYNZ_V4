estate-yellow = "https://yellow.co.nz"
parliament = "https://www.parliament.nz"     # every parliament-* corpus

# requests sent to the provider whose copies have not landed: a row each until its corpus appears in `corpora`
# (then the corpus's own row takes over). `due`: the provider's own date for the first copies (none: not given yet). A
# request whose corpus already exists stands until the corpus holds more than `until_records`; one marked
# `standing` stays until the provider reports it done and its entry is removed here (a corpus that grows is not done).
[[requests]]
id = "estate-directories@2026-11-13b"
title = "White Pages: newest copies and every archived version"
corpus = "estate-whitepages"
asked = 2026-11-13
due = 2026-11-16
url = "https://whitepages.co.nz"

[[requests]]
id = "estate-directories@2026-11-13b"
title = "Yellow: newest copies and every archived version"
corpus = "estate-yellow"
asked = 2026-11-13
due = 2026-11-20
url = "https://yellow.co.nz"

[[requests]]
id = "estate-council-minutes@2026-11-13"
title = "Every council's minutes, all 78 councils, all years"
corpus = "estate-council_minutes"
asked = 2026-11-13
due = 2026-11-24
url = "https://www.localcouncils.govt.nz"
until_records = 1990

[[requests]]
id = "estate-media@2026-11-13"
title = "87 media sources walked forward, back and through their thin months"
corpus = "estate-news"
asked = 2026-11-13
due = 2026-11-27
url = "/sources#news"
standing = true

[[requests]]
id = "estate-nzme@2026-11-13"
title = "NZ Herald from January 2025, and BusinessDesk whole"
corpus = "estate-news"
asked = 2026-11-13
due = 2026-11-20
url = "https://www.nzherald.co.nz"
standing = true

[[requests]]
id = "estate-current@2026-11-14"
title = "Every source current: eleven sections (Hansard, diaries, grants, tenders, elections, expenses and more)"
corpus = ""
asked = 2026-11-14
url = "/sources"

[[requests]]
id = "estate-media@2026-11-14"
title = "Twelve more sites: regulation.govt.nz, the legislation disclosures, the Reserve Bank, DIA, ACC and others"
corpus = "estate-news"
asked = 2026-11-14
url = "/sources#news"
standing = true

# news sites of the old copy left off the Sources tab: gathered another way (Arthur, 14 November 2026: "remove the ones
# that we ARe gathering through other means"). A name, or `*.` for every host under it, or `infocouncil.*` for every
# host beginning so.
[news]
other_means = [
 "gazette.govt.nz",                 # the Gazette register (DigitalNZ)
 "beehive.govt.nz",                 # the beehive corpus
 "hansard.parliament.nz",           # the Hansard corpora
 "elections.nz",                    # the election registers
 "courtsofnz.govt.nz", "forms.justice.govt.nz", "justice.govt.nz", "determinations.era.govt.nz",   # the courts corpora
 "*.infocouncil.biz", "infocouncil.*",   # the councils' minutes (estate-council_minutes)
 "companies-register.companiesoffice.govt.nz",   # the companies register
 "assets.national.org.nz", "assets.nationbuilder.com", "cdn.opportunity.org.nz", "res.cloudinary.com",
 "cdn.prod.website-files.com",      # file hosts behind the party and site pages the media request names
]

# copies no register reads because what they hold is held another way (14 November 2026): grey with the reason, not
# orange. Checked when written; a corpus here that gains something new needs its entry looked at again.
[covered]
estate-courts = "its 372 decisions are all held by their bytes: 293 at the same address in the courts corpus, the other 79 under other addresses (checked 14 Nov)"
estate-courts-survey = "reference pages of a one-off survey of the courts' sites (3 Nov), not records"
estate-elections = "the Electoral Commission's home page and site maps only; its records come through the election registers' own copies"
estate-charities = "the provider's copy of the Charities Services' open-data feed, which the charities lane reads from the feed itself"
estate-council_procurement = "the four councils' terms pages the procurement watch re-reads; the watch is off every schedule (ruling 136)"
