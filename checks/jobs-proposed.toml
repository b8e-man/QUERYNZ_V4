# Proposed for the job catalogue (support/scheduler/jobs.toml is the
# integrator's): the daily comparison with the frozen site (plan 4.5). At the
# merge: append, run `python -m support.scheduler check`, delete this file.
#
# Order of the day (NZDT): 06:15 the frozen release; 07:30 the checks board
# lists its captured documents; 08:00 qv4-site-build (19:00 UTC, deadline
# 1800 s) builds the rebuilt version from that listing; 08:45 this job pairs
# the two and writes the day. The board's item reads the ledger next morning.

[jobs.qv4-site-compare]
description = "Step 4.5: pair today's frozen release with the rebuilt version built from its listing, read every published file of the ten kinds on both sides figure by figure (no tolerance on money), group every difference by its cause, and write the day record and the clean-day ledger under <live>/checks/comparison/. Exits 1 when a difference has no cause card, or when no rebuilt version exists for today's listing. After qv4-site-build."
needs = "processor"
memory_gb = 1
deadline_s = 900
query_timeout_s = 60
class = "due"
priority = 52
command = ["python", "-m", "checks.comparison", "run"]
at_utc = "19:45"
nice = 10
