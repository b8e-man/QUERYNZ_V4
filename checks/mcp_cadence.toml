# How old the ingest MCP's copy of each corpus may get before it is stale (ruling 159, 10 November 2026).
#
# `days`: about how often the source publishes something new, so how long the provider's copy may go with no new
# arrival. The lights (checks/source_lights.py) judge each corpus by the provider's own `newest_arrival` from
# `corpora` (kept in mcpsource.freshness), never by our pull: past `days` the lanes reading it are orange, past three
# times `days` red, and the corpus goes on the provider's list (<work>/handover/mcp-stale.md).
# `basis`: "measured" from the history the estate holds (the days our own captures landed new documents before the
#   boxes stopped gathering on 9 November, docs.documents by source; or, for the MCP's own corpora, the days the pull
#   took new records, mcpsource.arrivals), or "default": a conservative guess, to be measured once the history allows.
# `paused_until`: a declared pause (the source publishes nothing until then). Until that day the corpus is not judged;
#   after it, its age counts from that day, so a copy that was quiet for a reason is not red the morning after.
# `days = 0`: a closed corpus (a one-off survey, a complete set), never judged.
# Measured on 10 November 2026 (stream F): new-document days per source, 18 October to 9 November.

# ── the sources handed to the provider on 5 November (estate-*) ──

