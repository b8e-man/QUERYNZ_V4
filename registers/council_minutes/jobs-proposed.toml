# Proposed for support/scheduler/jobs.toml; installed by the integrator (priorities are the integrator's to assign).
[jobs.qv4-council-minutes-capture]
description = "Step 6.3: the InfoCouncil councils' meeting listings (each at most weekly) and every minutes PDF they name, once, 5 s apart, off-peak; the old estate's 347 held PDFs never fetched again. About 600 PDFs the first nights, then tens a week. Stops at 06:00 NZDT or its budget."
needs = "processor"
memory_gb = 0.3
deadline_s = 10800
query_timeout_s = 60
class = "due"
command = ["python", "-m", "registers.council_minutes.capture", "--budget-s", "7200"]
at_utc = "09:15"
nice = 10

[jobs.qv4-council-minutes-load]
description = "Step 6.3: the meeting list from every listing held, built in staging, checked against each grid's own row count, published only on green."
needs = "processor"
memory_gb = 0.5
deadline_s = 900
query_timeout_s = 600
class = "due"
command = ["python", "-m", "registers.council_minutes.load", "--job"]
at_utc = "17:45"
