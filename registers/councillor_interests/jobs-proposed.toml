# Proposed for support/scheduler/jobs.toml; installed by the integrator (priorities are the integrator's to assign).
[jobs.qv4-councillor-interests-capture]
description = "Step 6.3: each council's register landing page monthly and every register document it links once, 5 s apart (or the site's crawl delay), off-peak; three councils held on their terms, blocked sites held. About 400 requests the first night, a few a night after."
needs = "processor"
memory_gb = 0.3
deadline_s = 7200
query_timeout_s = 60
class = "due"
command = ["python", "-m", "registers.councillor_interests.capture", "--budget-s", "3600"]
at_utc = "11:30"
nice = 10

[jobs.qv4-councillor-interests-load]
description = "Step 6.3: the 78 councils' registers and the structured pages' interests, built in staging, checked (78 councils, nothing withheld published), published only on green."
needs = "processor"
memory_gb = 0.5
deadline_s = 900
query_timeout_s = 600
class = "due"
command = ["python", "-m", "registers.councillor_interests.load", "--job"]
at_utc = "17:50"
