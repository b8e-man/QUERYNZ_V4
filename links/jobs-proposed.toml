# Proposed for support/scheduler/jobs.toml (the integrator's): the review job's command, changed by track C.
# `--job` reads QV4_ARGS: {"mode": "score" | "watched" | "apply", "limit": N, "schema": S, "run_id": ID}.
# With no args it reads 200 watched links and records them. Nothing is applied while links.SETTINGS["review_applies"] is off.
[jobs.qv4-links-review]
description = "Track C: the review agent reads test pairs (mode score) or watched confirmed links (mode watched, the default) through the review profile and records its verdicts in links.readings; applies nothing while the switch is off."
needs = "model-profile"
profile = "review"
memory_gb = 0.5
deadline_s = 7200
query_timeout_s = 120
class = "whenever"
priority = 60
command = ["python", "-m", "links.review", "--job"]
can_share = true
