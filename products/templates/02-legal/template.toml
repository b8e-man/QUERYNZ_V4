# Use case 2, the legal counterparty and conflict check (plan step 5.2,
# fourth template): a law firm asks, before it acts, "who is this
# counterparty, who stands on its register, and does anyone here already
# act for or against them". A subject report on the shape in
# products/report/; it reads only the published views below, and its
# sections run in the order a conflicts clerk reads them. Its own rules are
# in rules.py; its known limits in limits.md.
name = "legal"
title = "Legal counterparty and conflict check"
version = "0.1"
owner = "products/templates/02-legal, step 5.2 (session legal-1)"
# 2: the person's group, the companies it sits on, and the other people on
# those companies (near: a connection through another person is never
# confirmed): the conflict web. From a company the walk lists its officers
# and holders and follows each officer one step.
depth = 2

limits = [
  "The firm's own client and matter list is not an input: the report lists the names a conflict search would compare, and the comparison is the firm's. No flag here says there is no conflict.",
  "Started from a company, the report follows each current officer one step: the officer's other companies, how those ended, the notices on the officer's own record and the officer's society and charity roles are read and listed beside the officer, the officer's and never the company's. A check clears only when every officer was followed; an officer whose name is suppressed or who is past the walk's limit is not followed, and the check is blocked, saying how many. Holders of record are listed and not followed. Who sat beside the officers on their other companies is read (2 November 2026): the current directors of each company an officer's own row reaches, to 12 a company with the rest counted, each near, through the officer and then the company; a name on two of those companies is two rows that share a name, never one person.",
  "Court judgments are read as far as the courts corpus holds them, a part of the courts' judgments, so none found is never a clear; tribunals' decisions are read only where that corpus carries them. The Insolvency Register, the Real Estate Authority's and the Building Practitioners Board's decisions, the sanctions lists, WorkSafe and the Overseas Investment Office are read (9 November 2026); a person in them is matched by name, near, unless a rule confirms it. The Lawyers and Conveyancers Disciplinary Tribunal's findings beyond the corpus, the other professional bodies' findings and the Personal Property Securities Register are not held: what is not held is the last section, and nothing in this report says anything about it.",
  "A connection is as the register states it: a role, a holding of record, a donation filed under a name. Nothing here says who stands behind a holding or runs a company; a nominee or trustee holds for others.",
  "The party is the row the report starts from and the rows a rule confirms are the same person. A row that only shares the name is a namesake, listed apart, and is not the party until confirmed.",
  "Two facts are shown side by side with their dates. The report never says one followed from the other.",
  "The companies file lists current roles only: a company a person left, or that was removed with them on it, is not seen, so no check over a person's companies is ever clear.",
  "A Gazette bankruptcy notice is published but no link rule joins it to a person yet, so this report cannot see one: a blank there is not a clear.",
  "The other companies in an amalgamation notice, and a mortgagee's entry into possession, are published but not reachable by this report; each is named in its flag.",
  "The walk reads Gazette notices on the first twelve companies it reaches and lists up to forty; past those the checks that need them are blocked, never clear.",
  "A charity officer row is matched to the party by name only: no link joins the Charities Register's officers to any other row yet, so each is a namesake's until a rule confirms it.",
  "A company's registered office is listed and is flagged when fifty or more companies share it; the companies sharing a smaller office are not listed. No residential address is held in any view read.",
  "Companies register rows come from the old estate's tables; the original monthly file is not held, so those rows cite the row, not a document.",
  "A company's insolvency appointments are read from the companies file beside the Gazette's notices (since 2 November 2026): each liquidator, receiver or administrator by name, dated by the day appointed; an appointment after a resolution of solvency (a solvent winding-up) is listed and never counted a failure.",
]

