licence = "the business-number register, Creative Commons Attribution 4.0; a role's name and dates only, never an address"
attribution = "Companies Office, New Zealand Business Number register"
refresh = "company by company, by the history backfill and the monitor"
[[reads]]
view = "company_lookup_holdings"
licence = "the business-number register, Creative Commons Attribution 4.0; a holder's name and dates only, never an address"
attribution = "Companies Office, New Zealand Business Number register"
refresh = "company by company, by the history backfill and the monitor"

[[sections]]
name = "identity"
heading = "Who the party is, and its namesakes set apart"
views = ["directors", "shareholders", "society_officers", "party_return_donors", "party_return_loans", "disclosures", "disclosure_items",
         "candidate_return_donors", "promoter_people"]
sources = ["near"]
text = "The party is the row above: a company is its NZBN, and a person is the rows a rule confirms are the same person. Each row here shares a name with the party and no rule confirms it: a namesake, with the reason it is only near. A conflict search on the name will meet these rows; nothing in them is the party's."

[[sections]]
name = "officers"
heading = "Its officers and holders of record, with their dates"
views = ["directors", "shareholders", "company_addresses", "limited_partnerships", "limited_partnership_partners", "company_lookup_roles", "company_lookup_holdings"]
sources = ["roles", "members", "confirmed"]
text = "Every director and shareholder the companies file lists on the company, with the dates it files, and its registered office; started from a person, the person's own roles and holdings. A holding is shown as the register states it: a shareholder of record. A nominee or trustee holds for others, and a company holder's own register is not followed here: start a report from it. The file lists current roles only."

[[sections]]
name = "web"
heading = "The companies those people share, with dates: the conflict web"
views = ["companies", "directors", "shareholders"]
sources = ["members", "confirmed", "near", "second", "officers", "beside"]
text = "Each company the person sits on, with its register status and dates, and beneath it the other directors and holders of record on it with their own dates, each near: a connection through another person is never confirmed. These are the names a conflict search compares with the firm's clients and opposing parties. A name on two companies is two rows that share a name. Started from a company, the report does not follow its people: start a report from each officer listed above. Started from a company, the rows reached through each officer the walk followed one step are listed here too, near: the officer's, never the company's; and beneath each of the officer's other companies its current directors, near: a connection through two people."

[[sections]]
name = "gazette"
heading = "The Gazette on the company and its people"
views = ["gazette_liquidations", "company_insolvencies", "gazette_company_notices", "gazette_liquidators", "gazette_prohibitions", "gazette_bankruptcies", "gazette_appointments"]
sources = ["members", "confirmed", "near", "pointing", "officers", "named"]
text = "Liquidations, receiverships, administrations, winding-up applications, creditors' notices, deeds of company arrangement, removals, dissolutions and restorations, amalgamations, the Registrar's rectifications and transfers out, each under the company's name with its own date; then on the people, director prohibitions with their term and the person's own insolvency appointments as a practitioner. A removal from the register is not an insolvency. Bankruptcy notices are published but no link rule joins them to a person yet, and a mortgagee's entry into possession is not reachable here: neither can show. Started from a company, its people's notices are not read. Started from a company, the rows reached through each officer the walk followed one step are listed here too, near: the officer's, never the company's."

[[sections]]
name = "money"
heading = "Charity and society roles, and political money"
views = ["societies", "society_officers", "charities", "charity_officers", "charity_returns", "party_return_donors", "party_return_loans", "disclosures", "disclosure_items", "candidate_return_donors", "party_return_totals", "candidate_return_totals", "promoters", "promoter_people", "grants", "society_states", "councillor_interests"]
sources = ["members", "confirmed", "named", "roles", "officers"]
text = "Incorporated society roles; then the Charities Register: a charity officer row that carries the party's name, near: no link joins the register's officers to any other row yet, and, started from a company, its charity by business number (confirmed) with the officers and annual returns on it, the figures as filed and never added across returns; then donations, loans and promoters' roles. A donation is from the donor the Commission filed it under; a disclosure of a gift a return covers is shown beside it and never added. Started from a company, these are the company's own. Started from a company, the rows reached through each officer the walk followed one step are listed here too, near: the officer's, never the company's. Grants a funder published to the company by its business number, or to the charity by its registration number, as the funder lists them; never added across funders. A society's earlier states, as an earlier monthly file carried them. A councillor's register of interests that carries the subject's name, near by name; the entries are in the document cited, never here."

[[sections]]
name = "insolvency"
heading = "The Insolvency Register"
views = ["insolvency_people", "insolvency_companies"]
sources = ["members", "confirmed", "near", "named", "officers", "pointing"]
text = "A person's bankruptcy, no asset procedure or debt repayment order, and a company's liquidation the Official Assignee administers, as the register lists it, with its dates and status. A company's estate is joined by its business number; a person's only by the name, so near unless a rule confirms it: nothing in a namesake's estate is the subject's. An annulled bankruptcy's name is not shown. The register shows an estate for a period after its end and then removes it, so none listed here is not a finding of none before that window."

[[sections]]
name = "discipline"
heading = "Professional disciplinary decisions"
views = ["rea_decisions", "rea_parties", "building_practitioner_decisions", "building_practitioners"]
sources = ["members", "confirmed", "near", "named", "officers"]
text = "A party to a Real Estate Authority decision, and a Building Practitioners Board decision with the practitioner it names, joined to the licence register by the licence number the decision prints: confirmed where the names agree in full, near where they do not, the lack of a full match perhaps another rendering of the name. A decision states what the body decided. The Lawyers and Conveyancers Disciplinary Tribunal's decisions are read only where the courts corpus carries them; the other professional bodies' findings are not held."

[[sections]]
name = "sanctions"
heading = "Sanctions lists"
views = ["sanctions_listings"]
sources = ["members", "confirmed", "near", "named", "officers"]
text = "A listing on New Zealand's sanctions lists (the Russia Sanctions Act's register and the United Nations Security Council's lists as New Zealand applies them), as the list stands today, with its regime and dates. A listing is matched by name, so near unless a rule confirms it: a namesake's listing is not the subject's, and a near listing is a reason to check the list's own identifiers, never a finding."

[[sections]]
name = "regulators"
heading = "The regulators' listings"
views = ["commerce_commission_parties", "fma_parties", "worksafe_parties", "overseas_investment_parties"]
sources = ["named", "members", "confirmed", "near"]
text = "A party named in a regulator's listing as it stands today: the Commerce Commission's cases, the Financial Markets Authority's warnings and actions, WorkSafe's prosecutions and enforceable undertakings, and the Overseas Investment Office's decisions. A listing states what the regulator published, the charge, the case or the warning, never a cause. A near row shares a name with the subject and no rule confirms it: nothing in it is the subject's."

[[sections]]
name = "past-roles"
heading = "Past roles under the name, from the business-number register"
views = ["company_lookup_roles", "company_lookup_holdings"]
sources = ["named", "officers"]
text = "A role the business-number register states and no monthly file held, under the subject's name or a person's on the company: near, a person with this name and not confirmed to be the subject. One at a company that later failed is an amber warning in the failure checks. The register is read company by company, so most companies' past roles are not yet asked: none listed here is not a finding of none."

[[sections]]
name = "possessions"
heading = "Mortgagee possessions"
views = ["gazette_possessions"]
sources = ["pointing", "members", "confirmed", "near"]
text = "A lender's entry into possession of a mortgaged property, as the Gazette states it, where the notice names the entity, or a company the person is on, as mortgagor or as lender, with the day of entry. The property and a person mortgagor's name are not shown. A near row is a namesake's or an officer's other company's: nothing in it is the subject's."

[[sections]]
name = "courts"
heading = "Court judgments the corpus holds"
views = ["court_judgments", "court_judgment_parties", "court_people"]
sources = ["named", "members", "confirmed", "near", "officers"]
text = "A party to a judgment the courts corpus holds, as the judgment's heading names it or the text reader found it in the document. Being a party is not a finding against anyone: the judgment states what the court decided. A near row shares a name with the subject and no rule confirms it: nothing in it is the subject's. A name under a suppression order or withheld is never shown. The corpus holds a part of the courts' judgments (most of the Supreme Court's, some of the High Court's and the Court of Appeal's), so none listed here is not a finding of none."

[[sections]]
name = "not-held"
heading = "What is not held"
views = []
not_held = ["court_coverage", "securities", "fsp"]
text = "Registers a conflict check would read that no lane has published: the courts' judgments the courts corpus does not hold, the disciplinary findings of the Lawyers and Conveyancers Disciplinary Tribunal (beyond what the corpus carries) and of the other professional bodies (accountants, health practitioners), the Personal Property Securities Register, a limited partnership's limited partners (the register publishes its general partners, which are read) and financial service providers. The firm's own client and matter list is not an input. Land titles, ministers' diaries and the House's and the Beehive's mentions are published and not read here: they are not significant for a conflict check (ruling 146). Nothing in this report says anything about what is not held; ask the source."
