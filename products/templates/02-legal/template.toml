# ── sections, in the order a conflicts clerk reads them ─────────────────────
# A row is listed once, in the first section that names its view and the walk
# bucket it came from; an entity the walk reached (a company, a return) goes
# to the first section naming its view. So the party's own roles fill the
# officers section, and each company the party sits on heads the conflict
# web with the other people on it beneath. The first section takes only near
# links: rows that share the party's name and that no rule confirms.
[[sections]]
name = "identity"
heading = "Who the party is, and its namesakes set apart"
views = ["directors", "shareholders", "society_officers", "party_return_donors", "party_return_loans", "disclosures", "disclosure_items",
         "candidate_return_donors", "promoter_people"]
sources = ["near"]
text = "The party is the row above: a company is its NZBN, and a person is the rows a rule confirms are the same person. Each row here shares a name with the party and no rule confirms it: a namesake, with the reason it is only near. A conflict search on the name will meet these rows; nothing in them is the party's."

[[sections]]
name = "officers"
heading = "Its officers and holders of record, with their dates"
views = ["directors", "shareholders", "company_addresses"]
sources = ["roles", "members", "confirmed"]
text = "Every director and shareholder the companies file lists on the company, with the dates it files, and its registered office; started from a person, the person's own roles and holdings. A holding is shown as the register states it: a shareholder of record. A nominee or trustee holds for others, and a company holder's own register is not followed here: start a report from it. The file lists current roles only."

[[sections]]
name = "web"
heading = "The companies those people share, with dates: the conflict web"
views = ["companies", "directors", "shareholders"]
sources = ["members", "confirmed", "near", "second"]
text = "Each company the person sits on, with its register status and dates, and beneath it the other directors and holders of record on it with their own dates, each near: a connection through another person is never confirmed. These are the names a conflict search compares with the firm's clients and opposing parties. A name on two companies is two rows that share a name. Started from a company, the report does not follow its people: start a report from each officer listed above."

[[sections]]
name = "gazette"
heading = "The Gazette on the company and its people"
views = ["gazette_liquidations", "gazette_company_notices", "gazette_liquidators", "gazette_prohibitions", "gazette_bankruptcies"]
sources = ["members", "confirmed", "near", "pointing"]
not_held = ["insolvency"]
text = "Liquidations, receiverships, administrations, winding-up applications, creditors' notices, deeds of company arrangement, removals, dissolutions and restorations, amalgamations, the Registrar's rectifications and transfers out, each under the company's name with its own date; then on the people, director prohibitions with their term and the person's own insolvency appointments as a practitioner. A removal from the register is not an insolvency. Bankruptcy notices are published but no link rule joins them to a person yet, and a mortgagee's entry into possession is not reachable here: neither can show. Started from a company, its people's notices are not read."

[[sections]]
name = "money"
heading = "Charity and society roles, and political money"
views = ["societies", "society_officers", "charities", "charity_officers", "charity_returns", "party_return_donors", "party_return_loans", "disclosures", "disclosure_items", "candidate_return_donors", "party_return_totals", "candidate_return_totals", "promoters", "promoter_people"]
sources = ["members", "confirmed", "named", "roles"]
text = "Incorporated society roles; then the Charities Register: a charity officer row that carries the party's name, near: no link joins the register's officers to any other row yet, and, started from a company, its charity by business number (confirmed) with the officers and annual returns on it, the figures as filed and never added across returns; then donations, loans and promoters' roles. A donation is from the donor the Commission filed it under; a disclosure of a gift a return covers is shown beside it and never added. Started from a company, these are the company's own."

[[sections]]
name = "not-held"
heading = "What is not held"
views = []
not_held = ["courts", "insolvency", "securities", "limited_partnerships", "fsp", "sanctions", "linz"]
text = "Registers a conflict check would read that no lane has published: court judgments and tribunal decisions (step 5.4), the disciplinary findings of the Lawyers and Conveyancers Disciplinary Tribunal and the other professional bodies, the Insolvency Register, the Personal Property Securities Register, a limited partnership's partners, financial service providers, sanctions lists and land titles. The firm's own client and matter list is not an input. Nothing in this report says anything about them; ask the source."
