# ── sections, in the order a conflicts clerk reads them ─────────────────────
# A row is listed once, in the first section that names its view and the walk
# bucket it came from; an entity the walk reached (a company, a return) goes
# to the first section naming its view. So the party's own roles fill the
# officers section, and each company the party sits on heads the conflict
# web with the other people on it beneath. The first section takes only near
# links: rows that share the party's name and that no rule confirms.
[[reads]]
view = "commerce_commission_parties"
licence = "Crown copyright, licensed CC BY 4.0"
attribution = "Commerce Commission, case register"
refresh = "as the Commission lists them; re-read on the lane's clock"
[[reads]]
view = "fma_parties"
licence = "copyright the Financial Markets Authority, licensed CC BY 4.0"
attribution = "Financial Markets Authority"
refresh = "as the FMA lists them; re-read on the lane's clock"

[[reads]]
view = "limited_partnerships"
licence = "the business-number register, Creative Commons Attribution 4.0; the registered office is a company's, shown"
attribution = "Companies Office, New Zealand Business Number register"
refresh = "as the lane re-asks each partnership, stalest first"
[[reads]]
view = "limited_partnership_partners"
licence = "the business-number register, Creative Commons Attribution 4.0; general partners only, never an address"
attribution = "Companies Office, New Zealand Business Number register"
refresh = "as the lane re-asks each partnership, stalest first"

[[reads]]
