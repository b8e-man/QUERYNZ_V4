# Use case 5, business credit and monitoring (plan step 5.2, seventh
# template): a trade credit team asks "has anything changed for the companies
# I am exposed to, and what stands against this one today". A subject report
# on the shape in products/report/, re-run on change; it reads only the
# published views below, and its sections run in the order a credit analyst
# reads them. Its own rules are in rules.py; its known limits in limits.md.
#
# The grain is the companies register's monthly file. Two files are held
# (companies-2026-07 and companies-2026-08): a director, holder or registered
# office that arrived or left is dated to the file that first shows it, a
# month and not a day; the day the register files beside a row (an
# appointment, an office's start) is printed with it. A Gazette notice is
# dated to the day from the notice. Freshness waits on step 5.5 (the
# business-number interface on each lookup), the Insolvency Register and the
# Personal Property Securities Register; a "since" date and a watched list
# wait on the shape (carded).
name = "credit"
title = "Business credit and monitoring"
version = "0.1"
owner = "products/templates/05-credit, step 5.2 (session credit-1)"
# 2: from a company, its officers, holders and registered offices, the
# Gazette on it, and the companies that share its name (near); its people are
# listed and not followed. From a person, the person's companies, the notices
# and offices on them, and the other people on them (near).
depth = 2

limits = [
  "The grain is the monthly file: a change between two files is dated to the file that first shows it, a month and not a day. Two files are held, July and August 2026, so a change before the July file is not seen as a change, and nothing after the August file is seen at all until the next file is loaded or step 5.5 checks the entity against the business-number interface.",
  "A status change and a name change between files are published (pub.company_states) but the report's catalogue does not know that view, so this report cannot list them: the entity's status today is shown, and how it stood in the earlier file is not. The status-change half of every change check is blocked, never clear.",
  "The report takes no \"since\" date and keeps no watched list: it shows every change it can see, each dated, newest first, and the reader picks out what is new to them. Monitoring is the report re-run on the entity.",
  "Started from a company, the report lists its directors and holders of record but does not yet follow them: their other companies, how those stand, and the prohibitions and bankruptcies on them are not read, and those checks are blocked, never clear. Start a report from each director listed.",
  "The companies file lists current roles only, and the roles that left it since July 2026 with no end date: a director who left before the July file is not seen, nor a company the person left, so no check over a person's companies is ever clear.",
  "The companies change history (former names, trading names, earlier directors and offices) is not held before 16 August 2026, and is held but not published since.",
  "The Personal Property Securities Register, the Official Assignee's Insolvency Register, court judgments, credit-bureau defaults and a lender's entry into possession are not held or not reachable: each check that needs one is blocked, never clear.",
  "The entity is the row the report starts from and the rows a rule confirms are the same. A row that only shares the name is a namesake, set apart with its reason, and is not the entity until confirmed.",
  "Two facts are shown side by side with their dates: a director's departure and a Gazette notice, a new office and a liquidation. The report never says one followed from the other.",
  "A hub (a professional director, a nominee, an address with fifty or more companies) joins many companies: a change through a hub is shown, and a registered office that moves to a busy address is stated as the register files it.",
  "The walk reads Gazette notices on the first twelve companies it reaches and lists up to forty; past those the checks that need them are blocked, never clear.",
  "A company's registered office is shown as the companies file states it. No residential address is held in any view read.",
  "Companies register rows come from the old estate's tables; the original monthly file is not held, so those rows cite the row, not a document.",
]

# ── what it reads: each view with its licence ───────────────────────────────
[[reads]]
view = "companies"
licence = "Companies Office bulk data, Creative Commons Attribution 4.0; the register is public under the Companies Act 1993"
attribution = "Companies Office, New Zealand Business Number register"
refresh = "monthly file; the interface check of step 5.5 when built"
[[reads]]
view = "directors"
licence = "Companies Office bulk data, Creative Commons Attribution 4.0"
attribution = "Companies Office"
refresh = "monthly file; the interface check of step 5.5 when built"
[[reads]]
view = "shareholders"
licence = "Companies Office bulk data, Creative Commons Attribution 4.0"
attribution = "Companies Office"
refresh = "monthly file; the interface check of step 5.5 when built"
[[reads]]
view = "company_addresses"
licence = "Companies Office bulk data, Creative Commons Attribution 4.0; registered offices only, never a residential address"
attribution = "Companies Office"
refresh = "monthly file; the interface check of step 5.5 when built"
[[reads]]
view = "gazette_liquidations"
licence = "New Zealand Gazette, Crown copyright, Creative Commons Attribution 4.0"
attribution = "New Zealand Gazette"
refresh = "daily"
[[reads]]
view = "gazette_company_notices"
licence = "New Zealand Gazette, Crown copyright, Creative Commons Attribution 4.0; a person named in a rectification is held by initials and surname only"
attribution = "New Zealand Gazette"
refresh = "daily"
[[reads]]
view = "gazette_liquidators"
licence = "New Zealand Gazette, Crown copyright, Creative Commons Attribution 4.0; a practitioner's name and role only, never an address or telephone"
attribution = "New Zealand Gazette"
refresh = "daily"
[[reads]]
view = "gazette_appointments"
licence = "New Zealand Gazette, Crown copyright, Creative Commons Attribution 4.0; where an appointee lives is never kept"
attribution = "New Zealand Gazette"
refresh = "daily"
[[reads]]
view = "gazette_prohibitions"
licence = "New Zealand Gazette, Crown copyright, Creative Commons Attribution 4.0; a revoked prohibition's name is never shown"
attribution = "New Zealand Gazette"
refresh = "daily"
[[reads]]
view = "gazette_bankruptcies"
licence = "New Zealand Gazette, Crown copyright, Creative Commons Attribution 4.0; an annulled bankruptcy's name is withheld"
attribution = "New Zealand Gazette"
refresh = "daily"
[[reads]]
view = "societies"
licence = "Incorporated Societies Register, public under the Incorporated Societies Act 2022"
attribution = "Companies Office"
refresh = "as the lane re-reads the register"
[[reads]]
view = "society_officers"
licence = "Incorporated Societies Register, public under the Incorporated Societies Act 2022"
attribution = "Companies Office"
refresh = "as the lane re-reads the register"

# ── sections, in the order a credit analyst reads them ──────────────────────
# A row is listed once, in the first section that names its view and the walk
# bucket it came from; an entity the walk reached (a company, a society) goes
# to the first section naming its view. So the entity's standing heads the
# report (the entity itself is the header; every company the walk reached is
# listed with its status and dates, the person's own confirmed first, a
# namesake's or a same-name company near), the entity's own directors,
# holders and offices fill the changes section with the files that show
# them, and the dated change list itself, newest first, is the flag
# monthly-changes: a section cannot select only the rows that changed
# between files (carded). The first section takes only near links.
[[reads]]
view = "charities"
licence = "Charities Register open data, Creative Commons Attribution 3.0 New Zealand; the register is public under the Charities Act 2005; the address for service is never read"
attribution = "Charities Services, Department of Internal Affairs"
refresh = "changes by the feed's modified date; a full copy every 28 days"
[[reads]]
view = "charity_officers"
licence = "Charities Register open data, Creative Commons Attribution 3.0 New Zealand; a suppressed name is suppressed, the row stays"
attribution = "Charities Services, Department of Internal Affairs"
refresh = "changes by the feed's modified date; a full copy every 28 days"
[[reads]]
view = "charity_returns"
licence = "Charities Register open data, Creative Commons Attribution 3.0 New Zealand; the financial fields under the ruling of 14 August 2026"
attribution = "Charities Services, Department of Internal Affairs"
refresh = "changes by the feed's modified date; a full copy every 28 days"
[[sections]]
name = "identity"
heading = "The entity, and its namesakes set apart"
views = ["directors", "shareholders", "society_officers"]
sources = ["near"]
text = "The entity is the row above: a company is its NZBN, and a person is the rows a rule confirms are the same person. Each row here shares a name with it and no rule confirms it: a namesake, with the reason it is only near. A company that only shares the entity's name is listed in the next section, near; nothing in a namesake's rows is the entity's."

[[sections]]
name = "standing"
heading = "Its standing today: status, type, age and the latest file it is in"
views = ["companies", "societies"]
sources = ["members", "confirmed", "near"]
text = "The entity's own status, type, registration date and the latest monthly file it appears in are in the header above and the flag entity-status. Listed here: started from a person, each company the person sits on or holds, with its register status and the dates the register files; started from a company, the companies that share its name, near, with their states, apart from it. A status is as the latest file states it; how it stood in an earlier file is not shown (carded)."

[[sections]]
name = "changes"
heading = "What changed, month by month: directors, holders of record and registered offices, each dated by the file that first shows it"
views = ["directors", "shareholders", "company_addresses"]
sources = ["members", "confirmed", "roles"]
text = "The grain is the companies register's monthly file, and two files are held: July and August 2026. Each row here is dated by the files that show it: one first shown in the August file arrived between the two files, and one last shown in the July file left between them; that dates a change to a month, not a day. The day the register files beside a row (a director's appointment, an office's start) is printed with it and is the register's own date. The change list itself, newest first, is the flag monthly-changes. A status or name change between the files is published and not yet reachable by this report (carded). The file lists current roles only: a director who left before the July file is not seen."

[[sections]]
name = "gazette"
heading = "The Gazette on the entity: winding-up applications, liquidation, receivership, deeds, removals and restorations"
views = ["gazette_liquidations", "gazette_company_notices", "gazette_liquidators", "gazette_appointments"]
sources = ["pointing", "members", "confirmed", "near"]
not_held = ["insolvency", "courts"]
text = "Each Gazette notice on the entity, or on the companies above, under its company's name with the day the notice dates, which says what it dates: a liquidator's appointment, a hearing day, a removal's last day for objections; the day it was filed and published beside. Started from a person, also the person's own appointments as liquidator or to a public office. A removal from the register is not an insolvency, and a restoration reverses a removal."

[[sections]]
name = "people"
heading = "Its people: the people beside them, and their society and charity roles"
views = ["directors", "shareholders", "societies", "society_officers", "charities", "charity_officers", "charity_returns"]
sources = ["named", "second", "members", "confirmed", "roles"]
text = "Started from a person: the other directors and holders of record on the person's companies, each near (a connection through another person is never confirmed), then incorporated society roles, then the Charities Register: a charity officer row that carries the person's name, near (no link joins the register's officers to any other row yet), and a company's charity by business number, confirmed, with the officers and annual returns on it, the figures as filed and never added across returns; the person's companies and their states are in the standing section above. Started from a company, its people are listed in the changes section and are not followed: their other companies and those companies' states are not read, so an empty section here is not a clear; start a report from each director listed."

[[sections]]
name = "people-notices"
heading = "Prohibitions and bankruptcies among its people"
views = ["gazette_prohibitions", "gazette_bankruptcies"]
sources = ["members", "confirmed", "near"]
not_held = ["insolvency"]
text = "A director prohibition or a bankruptcy notice the link rules join to the person by name, with its dates; a near row shares the name only. A revoked prohibition and an annulled bankruptcy's name are never shown. Started from a company, its people's notices are not read, so an empty section here is not a clear: start a report from each director listed."

[[sections]]
name = "not-held"
heading = "What is not held"
views = []
not_held = ["securities", "insolvency", "courts", "limited_partnerships", "fsp"]
text = "Registers a credit check would read that no lane has published or this report cannot reach: the Personal Property Securities Register (who holds security over the company's assets, and since when), the Official Assignee's Insolvency Register (bankruptcies, no-asset procedures, summary instalment orders and their discharge; its daily removals check), court judgments (a creditor's judgment, a winding-up order's reasons), credit-bureau defaults and payment records, the companies change history before 16 August 2026 (former names, trading names, earlier directors and offices; held and unread since), the business-number interface's changes between monthly files until step 5.5 is built, a status or name change between the files held (published, not reachable), a lender's entry into possession (published, not reachable), a limited partnership's partners and financial service providers. Nothing in this report says anything about them; ask the source."
