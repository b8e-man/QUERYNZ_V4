# Use case 13, beneficial ownership and anti-money-laundering checks, the
# domestic half (plan step 5.2, fifth template): a compliance team asks "who
# ultimately holds or runs this, and are they exposed". A subject report on
# the shape in products/report/; it reads only the published views below, and
# its sections run in the order a compliance analyst reads them. Its own
# rules are in rules.py; its known limits in limits.md.
#
# The domestic half: the companies register's holders of record and
# directors, the Gazette, the House and political money. Sanctions lists,
# limited partnerships, overseas registers, trusts and the securities
# register are not held; every check that needs one is blocked, never clear.
name = "ownership"
title = "Beneficial ownership and AML checks, domestic half"
version = "0.1"
owner = "products/templates/13-ownership, step 5.2 (session ownership-1)"
# 2: from a company, its holders of record, directors and registered office;
# from a person, the companies the person holds or sits on and the other
# holders and directors on them (near).
depth = 2
# 2: from a company, each company holder of record followed up the chain two
# companies (fix-products-templates-1; the shape's `chain` reach since
# report-3, its companies above read since fix-report-2): by business number
# where the file carries one (confirmed), by a name only one company carries
# (near); each company above with its holders of record, current directors
# and Gazette notices; a chain cut at two says it goes on. The old chain
# page's default was three and its ceiling four.
chain_depth = 2

limits = [
  "The chain is followed two companies up from the first hop: a company holder by its business number where the file carries one (confirmed), otherwise by a name only one company in the register carries (near). A holder whose name several companies carry, or none (an overseas company, a trust, a body of another kind), is named and not followed; past two up the chain says it goes on. Every check that needs the people above the chain the registers reach is blocked, never clear. The depth limit is four hops.",
  "On each company above in the chain its holders of record, its current directors and the Gazette notices on it are listed with that company's grade: they are the holder's, not the entity's, and no check counts them as the entity's own. A charitable trust board holding shares of record is followed as a company; its charity's trustees are read only from a report started from it.",
  "A holder of record is the name on the share register and nothing more. For whom a nominee, trustee or custodian holds the shares is in no register held, and New Zealand keeps no register of trusts, nor of the people shares are held for.",
  "Sanctions lists (Foreign Affairs, the United Nations, the Police designations) are not held: the exposure check has no list to read and is blocked, never clear.",
  "Limited partnerships, overseas registers and the Personal Property Securities Register are not held: a holder that is a limited partnership or an overseas company is named as filed and not followed.",
  "The shares on a holder's row are the shares filed for that holding. A parcel held jointly is filed once per holder with the same number of shares, and no row says which rows share a parcel or how many shares the company has issued, so no fraction is computed and none is carried up the chain.",
  "A holding is dated only by the monthly files it was seen in (from July 2026); the register's own allocation dates are not published.",
  "Started from a company, the report lists its directors and holders of record but does not follow the people: their prohibitions, other companies, seats and donations are not read, and those checks are blocked, never clear. Start a report from each person listed.",
  "A holder that holds many companies is flagged only when its name says nominee, trustee, custodian or the Crown, or when it is a professional director: the count of companies a holder holds is not read by the walk.",
  "The entity is the row the report starts from and the rows a rule confirms are the same. A row that only shares the name is a namesake, set apart with its reason, and is not the entity until confirmed.",
  "Two facts are shown side by side with their dates. The report never says one followed from the other.",
  "A Gazette bankruptcy notice is published but no link rule joins it to a person yet, so this report cannot see one: a blank there is not a clear.",
  "A company's registered office is listed and is flagged when fifty or more companies share it. No residential address is held in any view read.",
  "Companies register rows come from the old estate's tables; the original monthly file is not held, so those rows cite the row, not a document.",
]

