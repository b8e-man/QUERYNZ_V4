# ── sections, in the order a compliance analyst reads them ──────────────────
# A row is listed once, in the first section that names its view and the walk
# bucket it came from; an entity the walk reached (a company, a return) goes
# to the first section naming its view, whatever that section's buckets. So
# each company heads the holders section with its holders of record beneath
# it, and a company that only shares the entity's name sits there too, near,
# with its reason, after every confirmed row. The first section takes only
# near links: rows that share the subject's name and that no rule confirms.
[[reads]]
view = "charities"
licence = "Charities Register open data, Creative Commons Attribution 3.0 New Zealand; the register is public under the Charities Act 2005; the address for service is never read"
attribution = "Charities Services, Department of Internal Affairs"
refresh = "changes by the feed's modified date; a full copy every 28 days"
[[reads]]
view = "charity_officers"
licence = "Charities Register open data, Creative Commons Attribution 3.0 New Zealand; a suppressed name is suppressed, the row stays"
attribution = "Charities Services, Department of Internal Affairs"
refresh = "changes by the feed's modified date; a full copy every 28 days"
[[reads]]
view = "charity_returns"
licence = "Charities Register open data, Creative Commons Attribution 3.0 New Zealand; the financial fields under the ruling of 14 August 2026"
attribution = "Charities Services, Department of Internal Affairs"
refresh = "changes by the feed's modified date; a full copy every 28 days"
[[sections]]
name = "identity"
heading = "The entity, and its namesakes set apart"
views = ["directors", "shareholders", "members", "candidates", "party_return_donors", "party_return_loans", "disclosures", "disclosure_items",
         "candidate_return_donors"]
sources = ["near"]
text = "The entity is the row above: a company is its NZBN, and a person is the rows a rule confirms are the same person. Each row here shares a name with the subject and no rule confirms it: a namesake, with the reason it is only near. Nothing in a namesake's rows is the subject's. A company that shares the name is listed in the next section, near, with its reason."

[[sections]]
name = "holders"
heading = "Its shareholders of record, with their shares and the files that date them, as far up the chain as the registers reach"
views = ["companies", "shareholders"]
sources = ["roles", "members", "confirmed", "near", "second"]
text = "Every shareholder of record the companies file lists on the company, with the shares filed for that holding and the monthly files it was seen in. A holder of record is shown as the register states it; a nominee, trustee or custodian holds for others, and for whom is in no register held. A holder that is a company is followed up the chain in the next section, and the flags below name each company holder. A parcel held jointly is filed once per holder, so the shares on two rows may be one parcel and are never added. Started from a person, each company the person holds or sits on, with its other holders of record beneath it, each near."

[[sections]]
name = "chain"
heading = "The holding chain above it: the companies that hold its shares of record, two up, with their holders, directors and notices"
views = ["companies", "shareholders", "directors", "gazette_liquidations", "gazette_company_notices"]
sources = ["chain"]
text = "Started from a company, each company holder of record followed to its own register row: by the business number the file carries for it, confirmed, or by a name only one company in the register carries, near, with its reason. Each company above is listed at its place up the chain with the shares of record it holds in the company below, as filed and never added or turned into a fraction, then its own holders of record, its current directors and the Gazette notices on it, each with that company's grade: the holder's rows, not the entity's. A company met twice is listed once; a holder whose name several companies carry, or none (an overseas company, a trust, a body of another kind), is named and not followed; at two up a company says the chain goes on. A holder of record is shown as the register states it; for whom it holds is in no register held. Started from a person, nothing is listed here: start a report from each company."

[[sections]]
name = "officers"
heading = "Its directors and registered office, and the directors of the companies a person sits on"
views = ["directors", "company_addresses"]
sources = ["roles", "members", "confirmed", "second"]
text = "Every director the companies file lists on the company, with the dates it files, and its registered office, flagged when many companies share it. The directors and holders of a company holder further up the chain are in the chain section. Started from a person, the person's own directorships, then the other directors on those companies, each near: a connection through another person is never confirmed."

[[sections]]
name = "gazette"
heading = "The Gazette on the companies and the people"
views = ["gazette_liquidations", "gazette_company_notices", "gazette_prohibitions", "gazette_bankruptcies"]
sources = ["members", "confirmed", "near", "pointing"]
not_held = ["insolvency"]
text = "Liquidations, receiverships, administrations, winding-up applications, creditors' notices, deeds of company arrangement, removals, restorations and amalgamations on the companies listed, each with its own date; then director prohibitions with their term on a person. A removal from the register is not an insolvency. Bankruptcy notices are published but no link rule joins one to a person yet. Started from a company, its people's notices are not read; the notices on a company holder further up are in the chain section."

[[sections]]
name = "exposure"
heading = "Public office and political money"
views = ["members", "candidates", "mp_interest_returns", "mp_interests", "party_return_donors", "party_return_loans", "disclosures", "disclosure_items",
         "candidate_return_donors", "party_return_totals", "candidate_return_totals"]
sources = ["members", "confirmed"]
text = "Seats in the House and candidacies confirmed to a person, and a member's declared interest that names the company; then donations and loans the Electoral Commission filed under the subject's name. A donation is from the donor the Commission filed it under; a disclosure of a gift a return covers is shown beside it and never added. Started from a company, these are the company's own: its directors' and holders' seats and donations are not read."

[[sections]]
name = "charities"
heading = "Registered charities: the entity's own, and the people's officer rows by name"
views = ["charities", "charity_officers", "charity_returns"]
sources = ["named", "roles", "members", "confirmed"]
text = "Started from a company, its charity by business number (a charitable trust board, an incorporated society or a company the Charities Register carries), confirmed, with the officers and annual returns the register files on it, the figures as filed and never added across returns. Started from a person, each charity officer row that carries the person's name, near: no link joins the register's officers to any other row yet, so each is a namesake's until a rule confirms it. A charity holding shares of record is a holder of record, as the register states it; the people it holds for are in no register held."

[[sections]]
name = "not-held"
heading = "What is not held"
views = []
not_held = ["sanctions", "limited_partnerships", "securities", "insolvency", "courts", "fsp", "linz"]
text = "Registers an anti-money-laundering check would read that no lane has published: the sanctions lists (the Russia Sanctions Act list kept by Foreign Affairs, the United Nations consolidated list, the Police designations under the Terrorism Suppression Act), the limited partnerships register and a partnership's general and limited partners, overseas company registers and an overseas holder's own holders, trusts and their trustees, settlors and the people they hold for (New Zealand keeps no register of trusts, nor of the people shares are held for), the Personal Property Securities Register, the Insolvency Register, court judgments, financial service providers and land titles. Nothing in this report says anything about them; ask the source."
