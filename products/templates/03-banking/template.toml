# Use case 3, banking director history (plan step 5.2, third template): a
# bank's credit analyst asks "every company this person has touched, and how
# each ended" before lending to them or to a company they run. A subject
# report on the shape in products/report/; it reads only the published views
# below, and its sections run in the order the analyst reads them. Its own
# rules are in rules.py; its known limits in limits.md.
name = "banking"
title = "Banking director history"
version = "0.1"
owner = "products/templates/03-banking, step 5.2 (session banking-1)"
# 2: the person's group, the companies it sits on, and the other people on
# those companies (listed as near: a connection through another person is
# never confirmed). From a company the walk lists its officers and holders
# and does not follow them.
depth = 2

limits = [
  "The companies file lists current roles only: a removed company keeps almost none of its directors and holders, and no role carries an end date. A company the person left, or that was removed with them on it, is not seen, so no check over the person's companies is ever clear; each fires on what it sees or is blocked.",
  "Only the registers the estate has published are read; what is not held is the last section, and nothing in this report says anything about it.",
  "A connection is as the register states it: a role, a holding of record, a donation filed under a name. Nothing here says who stands behind a holding or runs a company.",
  "The person is the row the report starts from and the rows a rule confirms are the same person. A row that only shares the name is a namesake, listed apart, and is not the person until confirmed.",
  "Started from a company, the report lists its officers and holders of record but does not yet follow them: their other companies, how those ended, their prohibitions and the people they sat beside are not read, and those checks are blocked, never clear. Start a report from each person listed.",
  "Two facts are shown side by side with their dates. The report never says one followed from the other, and a role that ended before a notice is a date beside a date.",
  "The walk reads Gazette notices on the first twelve companies it reaches and lists up to forty; past those, a company's register status is shown but its notices are not read, and the checks that need them are blocked, never clear.",
  "A Gazette bankruptcy notice is published but no link rule joins it to a person yet, so this report cannot see one: a blank there is not a clear.",
  "The people the person sat beside are other rows on the same companies, near by design. A name seen on two of the person's companies is two rows with one name; no rule says they are one person.",
  "The Personal Property Securities Register (who has lent against what), the Insolvency Register, court judgments, the limited partnerships register, financial service providers and sanctions lists are not held.",
  "A charity officer row is matched to the person by name only: no link joins the Charities Register's officers to any other row yet, so each is a namesake's until a rule confirms it, and the register's disqualified mark on one is amber at most.",
  "A company's registered office is listed and is flagged when many companies share it. No residential address is held in any view read.",
  "Companies register rows come from the old estate's tables; the original monthly file is not held, so those rows cite the row, not a document. A role that has left the file carries no end date, because the file states none.",
]

# ── what it reads: each view with its licence ───────────────────────────────
[[reads]]
view = "companies"
licence = "Companies Office bulk data, Creative Commons Attribution 4.0; the register is public under the Companies Act 1993"
attribution = "Companies Office, New Zealand Business Number register"
refresh = "monthly file; the interface check of step 5.5 when built"
[[reads]]
view = "directors"
licence = "Companies Office bulk data, Creative Commons Attribution 4.0"
attribution = "Companies Office"
refresh = "monthly file; the interface check of step 5.5 when built"
[[reads]]
view = "shareholders"
licence = "Companies Office bulk data, Creative Commons Attribution 4.0"
attribution = "Companies Office"
refresh = "monthly file"
[[reads]]
view = "company_addresses"
licence = "Companies Office bulk data, Creative Commons Attribution 4.0; registered offices only, never a residential address"
attribution = "Companies Office"
refresh = "monthly file"
[[reads]]
view = "gazette_liquidations"
licence = "New Zealand Gazette, Crown copyright, Creative Commons Attribution 4.0"
attribution = "New Zealand Gazette"
refresh = "daily"
[[reads]]
view = "gazette_company_notices"
licence = "New Zealand Gazette, Crown copyright, Creative Commons Attribution 4.0"
attribution = "New Zealand Gazette"
refresh = "daily"
[[reads]]
view = "gazette_prohibitions"
licence = "New Zealand Gazette, Crown copyright, Creative Commons Attribution 4.0; a revoked prohibition's name is never shown"
attribution = "New Zealand Gazette"
refresh = "daily"
[[reads]]
view = "gazette_bankruptcies"
licence = "New Zealand Gazette, Crown copyright, Creative Commons Attribution 4.0; an annulled bankruptcy's name is withheld"
attribution = "New Zealand Gazette"
refresh = "daily"
[[reads]]
view = "societies"
licence = "Incorporated Societies Register, public under the Incorporated Societies Act 2022"
attribution = "Companies Office"
refresh = "as the lane re-reads the register"
[[reads]]
view = "society_officers"
licence = "Incorporated Societies Register, public under the Incorporated Societies Act 2022"
attribution = "Companies Office"
refresh = "as the lane re-reads the register"
[[reads]]
view = "charities"
licence = "Charities Register open data, Creative Commons Attribution 3.0 New Zealand; the register is public under the Charities Act 2005; the address for service is never read"
attribution = "Charities Services, Department of Internal Affairs"
refresh = "changes by the feed's modified date; a full copy every 28 days"
[[reads]]
view = "charity_officers"
licence = "Charities Register open data, Creative Commons Attribution 3.0 New Zealand; a suppressed name is suppressed, the row stays"
attribution = "Charities Services, Department of Internal Affairs"
refresh = "changes by the feed's modified date; a full copy every 28 days"
[[reads]]
view = "charity_returns"
licence = "Charities Register open data, Creative Commons Attribution 3.0 New Zealand; the financial fields under the ruling of 14 August 2026"
attribution = "Charities Services, Department of Internal Affairs"
refresh = "changes by the feed's modified date; a full copy every 28 days"
[[reads]]
view = "party_return_donors"
licence = "Electoral Commission party returns: public documents published for inspection under the Electoral Act 1993"
attribution = "Electoral Commission"
refresh = "as each return or amendment is published"
[[reads]]
view = "party_return_loans"
licence = "Electoral Commission party returns: public documents published for inspection under the Electoral Act 1993"
attribution = "Electoral Commission"
refresh = "as each return or amendment is published"
[[reads]]
view = "party_return_totals"
licence = "Electoral Commission party returns: public documents published for inspection under the Electoral Act 1993"
attribution = "Electoral Commission"
refresh = "as each return or amendment is published"
[[reads]]
view = "disclosures"
licence = "Electoral Commission large-donation disclosures: published for inspection under the Electoral Act 1993"
attribution = "Electoral Commission"
refresh = "nightly listing"
[[reads]]
view = "disclosure_items"
licence = "Electoral Commission large-donation disclosures: published for inspection under the Electoral Act 1993"
attribution = "Electoral Commission"
refresh = "nightly listing"
[[reads]]
view = "candidate_return_donors"
licence = "Electoral Commission candidate returns: public documents published for inspection under the Electoral Act 1993"
attribution = "Electoral Commission"
refresh = "as each return is published"
[[reads]]
view = "candidate_return_totals"
licence = "Electoral Commission candidate returns: public documents published for inspection under the Electoral Act 1993"
attribution = "Electoral Commission"
refresh = "as each return is published"
[[reads]]
view = "promoters"
licence = "Register of Promoters, public under the Electoral Act 1993"
attribution = "Electoral Commission"
refresh = "as the register is published"
[[reads]]
