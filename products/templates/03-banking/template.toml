# ── sections, in the order a credit analyst reads them ──────────────────────
# A row is listed once, in the first section that names its view and the walk
# bucket it came from; an entity the walk reached (a company, a return) goes
# to the first section naming its view, so each company heads the endings
# section with its Gazette notices beneath it. The first section takes only
# near links: rows that share the person's name and that no rule confirms.
[[sections]]
name = "identity"
heading = "Who the person is, and the namesakes set apart"
views = ["directors", "shareholders", "society_officers", "party_return_donors", "party_return_loans", "disclosures", "disclosure_items",
         "candidate_return_donors", "promoter_people"]
sources = ["near"]
text = "The person is the row above and the rows a rule confirms are the same person; a company is its NZBN. Each row here shares a name with the subject and no rule confirms it: a namesake, with the reason it is only near. Nothing in a namesake's rows is the subject's."

[[sections]]
name = "roles"
heading = "Every directorship and shareholding the companies file lists, with its dates"
views = ["directors", "shareholders", "company_addresses"]
sources = ["members", "confirmed", "roles"]
text = "Each role and holding the companies file records, with the dates it files. The file lists current roles only, and roles that left it since July 2026 with no end date: a past directorship is not held. A holding is shown as the register states it: a shareholder of record, and a nominee or trustee holds for others, as the register names it. Started from a company, these are its officers and holders, and its registered office."

[[sections]]
name = "endings"
heading = "How each company ended: register status and Gazette notices, dated"
views = ["companies", "gazette_liquidations", "gazette_company_notices"]
sources = ["members", "confirmed", "near", "pointing"]
not_held = ["insolvency", "courts"]
text = "Each company with its register status and the dates the register files, and beneath it the Gazette's notices on it: liquidations, receiverships, administrations, winding-up applications, creditors' notices, removals and restorations, an overseas company ceasing, a society dissolved, each with its own date. The person's dates on the company are in the section above; the two sit side by side and nothing joins them. A removal from the register is not an insolvency."

[[sections]]
name = "person-notices"
heading = "Prohibitions and bankruptcies on the person"
views = ["gazette_prohibitions", "gazette_bankruptcies"]
sources = ["members", "confirmed", "near"]
not_held = ["insolvency"]
text = "A director prohibition the link rules join to the person by name, with its term. Bankruptcy notices are published but no link rule joins them to a person yet, so this section cannot show one. Started from a company, its people's notices are not read."

[[sections]]
name = "beside"
heading = "The people they sat beside, and the companies those people share with them"
views = ["directors", "shareholders"]
sources = ["second"]
text = "The other directors and holders of record on the person's companies, each under its company and each near: a connection through another person is never confirmed. A name on two of the person's companies is two rows that share a name. Started from a company, the report does not follow its people: start a report from each officer listed above."

[[sections]]
name = "money"
heading = "Charity and society roles, and political money"
views = ["societies", "society_officers", "charities", "charity_officers", "charity_returns", "party_return_donors", "party_return_loans", "disclosures", "disclosure_items", "candidate_return_donors", "party_return_totals", "candidate_return_totals", "promoters", "promoter_people"]
sources = ["members", "confirmed", "named", "roles"]
text = "Incorporated society roles; then the Charities Register: a charity officer row that carries the person's name, near: no link joins the register's officers to any other row yet, and, started from a company, its charity by business number (confirmed) with the officers and annual returns on it, the figures as filed and never added across returns; then donations, loans and promoters' roles. A donation is from the donor the Commission filed it under; a disclosure of a gift a return covers is shown beside it and never added. Started from a company, these are the company's own."

[[sections]]
name = "not-held"
heading = "What is not held"
views = []
not_held = ["securities", "insolvency", "courts", "limited_partnerships", "fsp", "sanctions", "linz"]
text = "Registers a credit check would read that no lane has published: the Personal Property Securities Register (security interests and who holds them; the full picture of a director's history waits on it), the Insolvency Register, court judgments, a limited partnership's partners, financial service providers, sanctions lists and land titles. Nothing in this report says anything about them; ask the source."
