# Step 8.5: use case 15, lobbying (step 6.2, template 4, part (b)), started from each attendee rather than the whole
# attendees text. For the register scan only.
name = "lobbying-attendees-donors"
title = "Ministers' meetings with a company, by one attendee, of the name a party's return files a donor under"
question = "Which companies, named by any one attendee of a meeting a minister's diary records, are also donors in a party's return under the same name; each line a meeting, the attendee's company and a donation side by side, and nothing more?"
join = "An attendee of a diary entry, as the diaries lane splits the entry's attendees; the company whose registered name is the attendee's organisation part once folded (near, each company of the name its own line, marked a namesake); a party-return donor row filed under the company's name once folded (near)."
version = "1.0"
owner = "products/scan/templates, step 8.5 (use case 15)"

limits = [
  "Ministers only: a backbench member publishes no diary, so a meeting of a member who is not a minister is never here; the diaries are each minister's own proactive release, as the source carries it, with the entries the office withheld left out by the office.",
  "A meeting is joined to a company by one attendee: the diaries lane splits each entry's attendees text by rules (separators, 'and', titles, the officials boilerplate) into one row each, and the attendee's organisation part (the 'Organisation' of 'Name (Organisation)' or 'Name, Organisation', the body before a group word as in 'Fonterra staff', or a body named alone) is matched to a company's registered name once folded. Measured 2 November 2026: 11,864 of 208,464 entries reach a company name this way (3,823 companies, 12,611 attendees), 5,631 of them entries the whole-text join of lobbying-meetings-donors does not reach.",
  "An attendee the split reads as a person with no organisation part, a group with no body's name ('Officials', 'Media', 'Cabinet Ministers'), a bare role ('CEO') or the release's withholding gives no line; the 6,974 entries whose whole attendees text alone is such a word and also a company's name ('Media', 'Office staff') are lines of lobbying-meetings-donors only. An organisation part the split marks as the Crown's own (a ministry, a department, a Crown agency, a Cabinet committee) is never read. 46 entries whose attendees text has an unbalanced bracket are set aside by the lane, unsplit.",
  "Every line is near: a name is not the organisation, and the split is read by rules from text as printed. A generic text a company happens to be registered under gives a line that is that company's namesake's, marked so; each company of the name is a line of its own. An entry naming two attendees of one company gives a line for each.",
  "An entry whose meeting or attendees text the diaries lane flags as naming an address is never read (hard limit 15): its attendees carry the entry's flags down and the scan's filter reads them. The meeting's own text and the attendee's are not shown, only the minister, the day, the portfolio, the time and the attendee's organisation part.",
  "Each line is two facts of record side by side: a meeting in a minister's diary, and the company's entry in a register. Nothing on it says why the meeting was held or that anything followed from it.",
  "The donor is the one the Electoral Commission filed (ruling 253), joined to the company by the folded name alone (near, the reason on the line); the name join lists every donor filed under the company's name, a namesake's included. A donation is never added across returns.",
  "Licences: the ministers' releases as released; Companies Office bulk data, CC BY 4.0; Electoral Commission returns, public under the Electoral Act 1993.",
]

[[reads]]
view = "minister_diary_attendees"
licence = "Ministers' diaries, proactively released by the ministers (Cabinet Office circular CO (18) 4); the copy from the third-party source Arthur supplies (ruling 78), split into attendees by the diaries lane"
attribution = "The minister's office, as released"
refresh = "each month's release, as the source carries it"
[[reads]]
view = "companies"
licence = "Companies Office bulk data, Creative Commons Attribution 4.0; the register is public under the Companies Act 1993"
attribution = "Companies Office, New Zealand Business Number register"
refresh = "monthly file"
[[reads]]
view = "party_return_donors"
licence = "Electoral Commission party returns: public documents published for inspection under the Electoral Act 1993"
attribution = "Electoral Commission"
refresh = "as each return or amendment is published"

[[steps]]
view = "minister_diary_attendees"
label = "attendee"
where = { attendees_names_address = false, meeting_names_address = false, crown = false }
columns = ["minister", "portfolio", "time", "kind"]
[[steps]]
view = "companies"
label = "company"
by = "name"
on = ["organisation", "name"]
namesakes = true
columns = ["status", "nzbn"]
[[steps]]
view = "party_return_donors"
label = "donor"
by = "name"
on = ["name", "donor"]
columns = ["party", "amount", "year"]
