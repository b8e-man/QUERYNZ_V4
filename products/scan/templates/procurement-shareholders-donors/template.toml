# Step 6.2, template 2: use case 9, government procurement integrity. The
# shareholders half of the template; procurement-directors-donors is
# the other (a chain lands on one view per step, so directors and
# shareholders are two scans with the same question). For the register
# scan only, never for the public site (step 6.2 row 2; 6.4 is Arthur's
# open question). Every line is a coincidence of record: a donation filed
# with the Electoral Commission, and an award to a company a holder of the
# same name sits on. Nothing on it says one led to the other.
name = "procurement-shareholders-donors"
title = "Coincidences of record: donors who share a name the links join with a shareholder of a supplier named on a government award"
question = "Who among a winning supplier's people (its shareholders of record, as the companies register lists them) also appears as a donor, in a party's return, a large-donation disclosure or a candidate's return, as the links join the two names; each line a coincidence of two public registers, and nothing more?"
join = "A donor row (a party's return, a disclosure, a candidate's return); a shareholder row the links join to it by a full-name or a name-only rule; the company whose shares that row holds; each supplier named on a GETS award notice whose business number is the company's, or, where either lacks one, whose name is the company's once folded; the award notice."
version = "1.0"
owner = "products/scan/templates, step 6.2 (use case 9)"

limits = [
  "For the register scan only, never for the public site: a donor joined to an award is the plainest case of a coincidence taken for more than it is (step 6.2, row 2). Whether the award join ever appears on Follow the Money is Arthur's open question (step 6.4); until he rules, nothing from this scan leaves the scan's page and files.",
  "Every line is a coincidence of record and nothing more: a donation as the Electoral Commission filed it, and an award as the ministry published it, to a company of which a holder of a name the links join holds shares. The dates are each register's own and are shown side by side; no line orders them into a story, and the list makes no claim about why an award was made or a donation given.",
  "Three joins in one line, each graded on the line: the donor and the shareholder by the links (full-name@1 confirmed, name-only@1 near, each with the link's reason); the company and the supplier by business number (confirmed) or else by name alone (near; each award to a supplier of that name is a line of its own); the shareholder and the company, and the supplier and the notice, by the registers' own keys. The supplier file publishes no usable business number (tenders-1), so every line is near at best today.",
  "The donor is the one the Commission filed (ruling 253). A filed donor row is in no group today, so the line reaches only the shareholder rows the links join to that donor row directly, not the holder's other holdings through the group (card: a-person-step-cannot-reach-a-filed-row-through-the-groups); the chains setting does not widen it.",
  "A party-return donor row an amendment replaced is listed beside its amendment, each its own line; a disclosure and the return that covers the same gift are each their own line and are never added together.",
  "No address of any kind is read. A shareholder's or a donor's address is never loaded; the company's registered office is read only to flag an office a thousand companies share, never printed. A suppressed shareholder shows as 'name suppressed' with the row kept. A nominee or trustee holder is flagged on the line: it holds as the register states, for others.",
  "Licences: Electoral Commission returns and disclosures, public under the Electoral Act 1993; Companies Office bulk data, CC BY 4.0; GETS award notices, CC BY 3.0 NZ, attribution to the Ministry of Business, Innovation and Employment on every surface.",
]

[[reads]]
view = "party_return_donors"
licence = "Electoral Commission party returns: public documents published for inspection under the Electoral Act 1993"
attribution = "Electoral Commission"
refresh = "as each return or amendment is published"
[[reads]]
view = "disclosures"
licence = "Electoral Commission large-donation disclosures: published for inspection under the Electoral Act 1993"
attribution = "Electoral Commission"
refresh = "nightly listing"
[[reads]]
view = "candidate_return_donors"
licence = "Electoral Commission candidate returns: public documents published for inspection under the Electoral Act 1993"
attribution = "Electoral Commission"
refresh = "after each election's returns are published"
[[reads]]
view = "shareholders"
licence = "Companies Office bulk data, Creative Commons Attribution 4.0"
attribution = "Companies Office"
refresh = "monthly file"
[[reads]]
view = "companies"
licence = "Companies Office bulk data, Creative Commons Attribution 4.0; the register is public under the Companies Act 1993"
attribution = "Companies Office, New Zealand Business Number register"
refresh = "monthly file"
[[reads]]
view = "award_suppliers"
licence = "Ministry of Business, Innovation and Employment, GETS award notices open data, Creative Commons Attribution 3.0 New Zealand (CC BY 3.0 NZ)"
attribution = "Source: Ministry of Business, Innovation and Employment, New Zealand Government procurement award notices (GETS open data), licensed under CC BY 3.0 NZ"
refresh = "the ministry's quarterly file (qv4-tenders-refresh; blocked while the ministry's host answers 403)"
[[reads]]
view = "award_notices"
licence = "Ministry of Business, Innovation and Employment, GETS award notices open data, Creative Commons Attribution 3.0 New Zealand (CC BY 3.0 NZ)"
attribution = "Source: Ministry of Business, Innovation and Employment, New Zealand Government procurement award notices (GETS open data), licensed under CC BY 3.0 NZ"
refresh = "the ministry's quarterly file, with the suppliers"

[[steps]]
views = ["party_return_donors", "disclosures", "candidate_return_donors"]
label = "donor"
columns = ["party", "amount"]
[[steps]]
view = "shareholders"
label = "shareholder"
by = "link"
rule = ["full-name@1", "name-only@1"]
columns = ["shareholder_type", "shares", "allocation_status"]
[[steps]]
view = "companies"
label = "company"
by = "row"
on = ["entity_key", "key"]
columns = ["status", "nzbn"]
[[steps]]
view = "award_suppliers"
label = "supplier"
by = "name"
on = ["name", "business_name"]
number = ["nzbn", "nzbn"]
columns = ["nzbn_form"]
[[steps]]
view = "award_notices"
label = "award"
by = "row"
on = ["notice_key", "key"]
columns = ["award_type", "awarded_amount_as_published", "value_note", "categories"]
