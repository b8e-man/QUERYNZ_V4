# Step 8.5: use case 15, lobbying (step 6.2, template 4, parts (a) and (b)). For the register scan only.
name = "lobbying-meetings-suppliers"
title = "Ministers' meetings with a company that is a supplier on a government award"
question = "Which companies a minister's diary records a meeting with, by the company's whole registered name, are also suppliers named on a GETS award notice; each line a meeting and an award side by side, and nothing more?"
join = "A diary entry; the company whose registered name is the entry's whole attendees text once folded (near, each company of the name its own line, marked a namesake); each supplier on a GETS award whose business number is the company's, or whose name is the company's once folded (optional); the award notice."
version = "1.0"
owner = "products/scan/templates, step 8.5 (use case 15)"

limits = [
  "Ministers only: a backbench member publishes no diary, so a meeting of a member who is not a minister is never here; the diaries are each minister's own proactive release, as the source carries it, with the entries the office withheld left out by the office.",
  "A meeting is joined to a company only where the whole of the diary's attendees text is the company's registered name once folded (lower case, macrons off, a legal ending such as Limited off, letters and digits only); an entry that lists several attendees, or names an organisation by another form of its name, gives no line. Measured 2 November 2026: 7,250 of 208,464 entries, to 1,362 companies; splitting the attendees into one row each would reach about 4,000 entries more, and is the diaries lane's to publish, not a scan's.",
  "Every line is near: a name is not the organisation. A generic text a company happens to be registered under ('office staff', 'event organisers', 'private secretary') gives a line that is that company's namesake's, marked so; each company of the name is a line of its own.",
  "An entry whose meeting or attendees text the diaries lane flags as naming an address is never read (hard limit 15); the meeting's own text is not shown, only the minister, the day, the portfolio and the time.",
  "Each line is two facts of record side by side: a meeting in a minister's diary, and the company's entry in a register. Nothing on it says why the meeting was held or that anything followed from it.",
  "The supplier step is optional: a company met is listed with 'none found in pub.award_suppliers' where the GETS file names it on none. The award notices are the ministry's GETS file (CC BY 3.0 NZ); awards under the thresholds, direct awards and most councils' are not in it.",
  "Licences: the ministers' releases as released; Companies Office bulk data, CC BY 4.0; GETS award notices, CC BY 3.0 NZ, attribution to the Ministry of Business, Innovation and Employment on every surface.",
]

[[reads]]
view = "minister_diary_entries"
licence = "Ministers' diaries, proactively released by the ministers (Cabinet Office circular CO (18) 4); the copy from the third-party source Arthur supplies (ruling 78)"
attribution = "The minister's office, as released"
refresh = "each month's release, as the source carries it"
[[reads]]
view = "companies"
licence = "Companies Office bulk data, Creative Commons Attribution 4.0; the register is public under the Companies Act 1993"
attribution = "Companies Office, New Zealand Business Number register"
refresh = "monthly file"
[[reads]]
view = "award_suppliers"
licence = "Ministry of Business, Innovation and Employment, GETS award notices open data, Creative Commons Attribution 3.0 New Zealand (CC BY 3.0 NZ)"
attribution = "Source: Ministry of Business, Innovation and Employment, New Zealand Government procurement award notices (GETS open data), licensed under CC BY 3.0 NZ"
refresh = "the ministry's quarterly file (qv4-tenders-refresh; blocked while the ministry's host answers 403)"
[[reads]]
view = "award_notices"
licence = "Ministry of Business, Innovation and Employment, GETS award notices open data, Creative Commons Attribution 3.0 New Zealand (CC BY 3.0 NZ)"
attribution = "Source: Ministry of Business, Innovation and Employment, New Zealand Government procurement award notices (GETS open data), licensed under CC BY 3.0 NZ"
refresh = "the ministry's quarterly file, with the suppliers"

[[steps]]
view = "minister_diary_entries"
label = "meeting"
where = { attendees_names_address = false, meeting_names_address = false }
columns = ["minister", "portfolio", "time"]
[[steps]]
view = "companies"
label = "company"
by = "name"
on = ["attendees", "name"]
namesakes = true
columns = ["status", "nzbn"]
[[steps]]
view = "award_suppliers"
label = "supplier"
by = "name"
on = ["name", "business_name"]
number = ["nzbn", "nzbn"]
optional = true
columns = ["nzbn_form"]
[[steps]]
view = "award_notices"
label = "award"
by = "row"
on = ["notice_key", "key"]
optional = true
columns = ["posting_agency", "rfx_id", "awarded_on"]
