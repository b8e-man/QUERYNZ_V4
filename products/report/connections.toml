variables = []

# ── the base configuration, by the kind of subject ───────────────────────────
# `views`: the subject's view; `fragment`: when the subject's ref carries a part after '#', the part it must be;
# `name`: a pattern the subject's registered name must carry (folded, whole words); `min_directorships`: a current director
# of the subject must hold more directorships than this (walk.role_counts, by the director's group). `set`: "type.variable" = value,
# "type" = "off" for a type not shown. `hub`: the line the result carries; `gap`: what is not built yet.

[[base]]
subject = "party"
words = "a registered political party"
views = ["parties"]
set = { "donation.order" = "size", "donation.top" = "10", "donation.years" = "3" }
hub = "a party: {n} donations filed in its returns, {p} of them over {years}; the top {top} by {order} are listed and no donor is followed further"
hub_off = "a party: {n} donations filed in its returns, {p} of them over {years}; none is listed (donations are off) and no donor is followed further"

[[base]]
subject = "liquidator"
words = "a liquidator or receiver"
views = ["company_insolvencies", "gazette_liquidators", "gazette_practitioners"]
fragment = "appointee"
set = { "insolvency" = "off" }
hub = "a liquidator or receiver: {n} appointments held in the companies file; the companies appointed to are not listed and not followed further (the appointment shows on the company's own record)"

[[base]]
subject = "trustee"
words = "a trustee, nominee or custodian company"
views = ["companies"]
name = "trustees?|nominees?|custodians?|custodial"
min_directorships = 50   # and a current director whose group holds more than this: a family trust's trustee company is no hub
set = { "director.follow" = "no", "shareholder.follow" = "no" }
hub = "a trustee, nominee or custodian company: its people are listed and their other directorships and holdings are not followed further ({n} directorships among them)"
gap = "a measure of the significance of a trustee company's directorships (the value of the companies, or their deeper connections) is not built: until it is, they are counted, not followed"
