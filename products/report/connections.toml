[[types]]
key = "charity_officer"
words = "charity officer"
views = ["charity_officers"]
variables = ["when", "since", "follow"]

[[types]]
key = "partner"
words = "general partner"
views = ["limited_partnership_partners"]
variables = ["when", "since", "follow"]

[[types]]
key = "party_board"
words = "party board role"
