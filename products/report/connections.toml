# The one report's connection types and its base configuration (Arthur, 10 November 2026; rulings 158 and 159).
#
# A connection type is a kind of row the walk lists, named in plain words, by the published view the row comes from
# (products/report/connections.py, `type_of`; a view no type names falls into the type of its register). Each type
# has a tick (shown or not) and the variables named in its `variables`, offered as dropdowns in the pane beside the
# report on the board's report tab. A setting changes what is followed, not only what is shown: a row of a type
# that is off is neither listed nor followed, and every row reached through it goes with it, counted.
#
# The base configuration is what a report starts with, by the kind of subject (`[[base]]`, the first that matches;
# none matching: every type followed as before). The pane's settings live in the page's address.

# ── the variables ────────────────────────────────────────────────────────────

[variables.when]
words = "roles"
default = "past"
choices = [["current", "current only"], ["past", "past too, listed"], ["followed", "past too, followed"]]

[variables.since]
words = "ended"
default = "any"
choices = [["any", "any time"], ["1", "in the past year"], ["3", "in the past 3 years"], ["5", "in the past 5 years"], ["10", "in the past 10 years"]]

[variables.follow]
words = "from it"
default = "yes"
choices = [["yes", "followed further"], ["no", "not followed further"]]

[variables.order]
words = "by"
default = "size"
choices = [["size", "size"], ["recency", "recency"]]

[variables.top]
words = "top"
default = "all"
choices = [["10", "10"], ["25", "25"], ["50", "50"], ["100", "100"], ["all", "all"]]

[variables.years]
words = "over"
default = "all"
choices = [["1", "the past year"], ["3", "the past 3 years"], ["6", "the past 6 years"], ["10", "the past 10 years"], ["all", "every year held"]]

# ── the types, in the pane's order ───────────────────────────────────────────

[[types]]
key = "director"
words = "director"
views = ["directors", "company_lookup_roles"]
variables = ["when", "since", "follow"]

[[types]]
key = "shareholder"
words = "shareholder"
views = ["shareholders", "company_lookup_holdings"]
