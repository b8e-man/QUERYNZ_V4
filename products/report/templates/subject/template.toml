[[sections]]
name = "money"
heading = "Donations, loans and disclosures"
views = ["party_return_donors", "party_return_loans", "disclosures", "disclosure_items", "candidate_return_donors", "party_return_totals", "candidate_return_totals", "grants"]
text = "A donation is from the donor the Commission filed it under. A return that covers a gift is the record; a disclosure of the same gift is shown beside it and never added."

[[sections]]
name = "companies"
heading = "Companies: roles, holdings of record, registered offices, earlier states"
views = ["companies", "directors", "shareholders", "company_addresses", "company_states", "limited_partnerships", "limited_partnership_partners", "company_lookup_roles", "company_lookup_holdings"]
text = "A holding is shown as the register states it: a shareholder of record. Nobody is called an owner. From a company start, its officers' other current roles, the companies at its office and the holders up its chain are listed near, each with its reason."

[[sections]]
name = "societies"
heading = "Incorporated societies"
views = ["societies", "society_officers", "society_states"]

[[sections]]
name = "charities"
heading = "Registered charities: officers and annual returns"
views = ["charities", "charity_officers", "charity_returns"]
text = "A charity reached from a company by its business number is confirmed. No link joins the register's officers to any other row yet, so an officer row that carries the subject's name is matched by name and is near, never confirmed, until the links lane joins the register. A charity's returns are listed newest first, the figures as filed."

[[sections]]
name = "insolvency"
heading = "Insolvency, possessions, prohibitions and bankruptcies in the Gazette"
views = ["gazette_liquidations", "gazette_company_notices", "gazette_possessions", "gazette_liquidators", "gazette_practitioners", "gazette_prohibitions", "gazette_bankruptcies"]
not_held = ["insolvency", "court_coverage"]

[[sections]]
name = "public"
heading = "Public roles: appointments, candidacies, seats, declared interests, promoters"
views = ["gazette_appointments", "candidates", "members", "mp_interest_returns", "mp_interests", "parties", "promoters", "promoter_people", "councillor_interests"]

[[sections]]
name = "expenses"
heading = "Expenses the House and the Executive released"
views = ["mp_expenses", "minister_expenses"]
text = "The releases print a name only, so these rows are matched by name and are near, never confirmed. Each is the period total as printed, or money the release prints outside its total, shown beside and never added."

[[sections]]
name = "regulators"
heading = "The regulators' listings: WorkSafe, the Commerce Commission, the Financial Markets Authority"
views = ["worksafe_actions", "worksafe_parties", "commerce_commission_cases", "commerce_commission_parties", "fma_actions", "fma_parties"]
text = "A listing as the regulator publishes it today: the charge, the case or the warning, never a cause. A party row that shares a name with the subject and that no rule confirms is near: nothing in it is the subject's."

[[sections]]
name = "rea"
heading = "Real Estate Authority decisions"
views = ["rea_parties", "rea_decisions"]
text = "Each licensee, agency or defendant a decision of the Authority names, as its decisions database lists it; matched by name, so near: a namesake's until a rule confirms it, and a row reached through an officer is the officer's. Being named is not a finding unless the decision cited says so; the penalty and the reasoning are in the decision."

[[sections]]
name = "board"
heading = "Building Practitioners Board decisions"
views = ["building_practitioner_decisions"]
text = "A decision as the Board publishes it, for three years from the decision. The Board names the practitioner and a licence number; no link joins either to another register, so a row that shares the subject's name is near: nothing in it is the subject's until the licence number is checked."

[[sections]]
name = "overseas"
heading = "Overseas Investment Office decisions"
views = ["overseas_investment_decisions", "overseas_investment_parties"]
text = "A decision summary as the Office publishes it: the applicant, the vendor, the outcome and the date. No link joins a party to another register, so a party that shares the subject's name is near: nothing in it is the subject's."

[[sections]]
name = "contracts"
heading = "Government contracts awarded"
views = ["award_notices", "award_suppliers"]
sources = ["named", "members", "confirmed", "near"]
text = "A government contract award notice that names the subject as a supplier, as GETS publishes it. The value is the notice's: on a panel or a multi-supplier award it is the whole award's, not this supplier's share. A near row shares a name with the subject and no rule confirms it: nothing in it is the subject's. Contracts below the thresholds, direct awards, and most councils' and private clients' contracts carry no GETS notice, so none listed here is not a finding of none."

[[sections]]
name = "courts"
heading = "Court judgments the corpus holds"
views = ["court_judgments", "court_judgment_parties", "court_people"]
sources = ["named", "members", "confirmed", "near", "officers"]
text = "A party to a judgment the courts corpus holds, as the judgment's heading names it or the text reader found it in the document. Being a party is not a finding against anyone: the judgment states what the court decided. A near row shares a name with the subject and no rule confirms it: nothing in it is the subject's. A name under a suppression order or withheld is never shown. The corpus holds a part of the courts' judgments (most of the Supreme Court's, some of the High Court's and the Court of Appeal's), so none listed here is not a finding of none."
