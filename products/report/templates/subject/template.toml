licence = "Grants as published: the Department of Internal Affairs class 4 grants data (CC BY 4.0) and each society's own list (facts read and cited under the position class-4-society-grant-publications); the licence of each row is on the row"
attribution = "each row's own attribution (pub.grants.attribution)"
refresh = "as each funder publishes; the national file quarterly"
